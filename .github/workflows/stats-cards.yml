name: Update README Stats Cards

on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/stats-cards.yml"

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Generate stats cards
        env:
          BASE: https://github-readme-stats.shion.dev
          OPTS: hide_border=true&bg_color=080b0a&title_color=00C896&text_color=c9ddd4&icon_color=00C896
        run: |
          set -euo pipefail
          mkdir -p assets/stats

          curl -fsSL --max-time 60 -o assets/stats/stats.svg \
            "${BASE}/api?username=dogancanyildiz&show_icons=true&include_all_commits=true&count_private=true&${OPTS}&ring_color=00C896"

          curl -fsSL --max-time 60 -o assets/stats/top-langs.svg \
            "${BASE}/api/top-langs/?username=dogancanyildiz&layout=compact&include_all_commits=true&count_private=true&${OPTS}"

          for repo in wikonya gpa bilet-satin-alma MegaYazilimAkademisiBitirmeProjesi; do
            curl -fsSL --max-time 60 -o "assets/stats/pin-${repo}.svg" \
              "${BASE}/api/pin/?username=dogancanyildiz&repo=${repo}&${OPTS}"
          done

          curl -fsSL --max-time 60 -o assets/stats/activity.svg \
            "https://github-readme-activity-graph.vercel.app/graph?username=dogancanyildiz&bg_color=080b0a&color=00C896&line=00C896&point=f4f7f5&area=true&hide_border=true&area_color=03624C"

          # Basic sanity: files must look like SVG
          for f in assets/stats/*.svg; do
            grep -q '<svg' "$f" || { echo "invalid svg: $f"; exit 1; }
          done

      - name: Commit updated cards
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/stats/*.svg
          git commit -m "chore: refresh README stats cards" || exit 0
          git push
