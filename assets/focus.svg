<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 220" width="1100" height="220" role="img" aria-label="Current focus">
  <defs>
    <linearGradient id="fc-border" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#00C896" stop-opacity="0.85"/>
      <stop offset="1" stop-color="#03624C" stop-opacity="0.55"/>
    </linearGradient>
    <linearGradient id="fc-bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0d1613"/>
      <stop offset="1" stop-color="#080b0a"/>
    </linearGradient>
  </defs>

  <rect x="1" y="1" width="1098" height="218" rx="10" fill="url(#fc-bg)" stroke="url(#fc-border)" stroke-width="1.2"/>
  <rect x="18" y="18" width="4" height="184" rx="2" fill="#00C896" opacity="0.85"/>

  <text x="42" y="48" font-family="JetBrains Mono, ui-monospace, monospace" font-size="11" letter-spacing="3.5" fill="#00C896">CURRENT FOCUS</text>
  <text x="42" y="86" font-family="Playfair Display, Georgia, serif" font-size="28" fill="#f4f7f5">Dravcore Ecosystem</text>
  <text x="42" y="120" font-family="JetBrains Mono, ui-monospace, monospace" font-size="13" fill="#9bb5ab">Go + QEMU virtualization &#183; Coolify &#183; Docker &#183; Traefik &#183; Self-hosting</text>

  <g font-family="JetBrains Mono, ui-monospace, monospace" font-size="12" fill="#c9ddd4">
    <text x="42" y="160">&#9656; Building reliable systems that live on my own infrastructure</text>
    <text x="42" y="186">&#9656; Shipping product + platform, not just features</text>
  </g>

  <circle cx="1048" cy="40" r="5" fill="#00C896">
    <animate attributeName="opacity" values="0.35;1;0.35" dur="2s" repeatCount="indefinite"/>
  </circle>
  <text x="1034" y="44" text-anchor="end" font-family="JetBrains Mono, ui-monospace, monospace" font-size="10" letter-spacing="2" fill="#7f958c">LIVE</text>
</svg>
